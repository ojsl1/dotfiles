# ~/.config/tmux/tmux.conf

# bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && \
   ~/.config/tmux/plugins/tpm/bin/install_plugins'"

set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh
set -g history-limit 999999
set -g mode-keys vi
set -g mouse on
set -g repeat-time 500

# Enable CSI-u shortcuts for nvim
set -as terminal-features 'xterm-kitty:extkeys'
set -s extended-keys on

# True colors
set -g terminal-overrides ",*:Tc"

# folke/snacks.nvim image rendering via kitty graphics protocol
set -g allow-passthrough all

# Styles (pre-catppuccin)
#set -g status-style "bg=#8ac6f2,fg=black"
#set -g pane-active-border-style fg='#f5abb9'
#set -g pane-border-style fg=white

### =========================================================
### Keybinds
### =========================================================

# Rebind: C-b o -> C-b e
bind 'e' select-pane -t :.+

# Rebind splits with preserve pwd
bind '\' split-window -h -c '#{pane_current_path}'  # Split panes horizontal
bind '-' split-window -v -c '#{pane_current_path}'  # Split panes vertically

# Source new settings (doesn't unset/unbind old bindings)
bind 'k' source-file ~/.config/tmux/tmux.conf

### =========================================================
### Scrollwheel hacks
### =========================================================

# 1. enter copy-mode with wheelup
# works for:      shell
# doesn't work:   VIM, LESS, MAN
bind -n WheelUpPane \
	if-shell -Ft = "#{mouse_any_flag}" \
		"send -M" \
		"if-shell -Ft= '#{pane_in_mode}' \
			'send -M' 'copy-mode -e'"

